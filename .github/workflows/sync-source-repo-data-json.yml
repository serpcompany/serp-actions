name: sync-source-repo-data-json

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run without writing data.json to target repos
        required: false
        default: true
        type: boolean
      limit:
        description: Optional first N repos to process for testing
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: sync-source-repo-data-json
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate sync script and config
        run: |
          node --check scripts/sync-source-repo-data-json.mjs
          node scripts/sync-source-repo-data-json.mjs --self-test
          node scripts/sync-source-repo-data-json.mjs --validate

      - name: Sync source repo data.json
        env:
          SERPCOMPANY_SOURCE_REPO_DATA_JSON_TOKEN: ${{ secrets.SERPCOMPANY_SOURCE_REPO_DATA_JSON_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
          SUMMARY_PATH: tmp/sync-source-repo-data-json-summary.json
        run: node scripts/sync-source-repo-data-json.mjs

      - name: Upload sync summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-source-repo-data-json-summary
          path: tmp/sync-source-repo-data-json-summary.json
          if-no-files-found: error
